name: RAF TV FACIL - Testar fontes candidatas
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar candidatos separadamente da lista publicada
        shell: bash
        run: |
          python - <<'PYTEST'
          import csv, json, re, urllib.request, urllib.error, urllib.parse, concurrent.futures, time, os
          from pathlib import Path
          
          LIMIT=1024*1024
          
          class HttpsRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  parsed=urllib.parse.urlsplit(newurl)
                  if parsed.scheme != 'https' or parsed.username or parsed.password:
                      raise ValueError('redirecionamento inseguro recusado')
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          opener=urllib.request.build_opener(HttpsRedirect())

          def get(url, segment=False):
              if urllib.parse.urlsplit(url).scheme != 'https':
                  raise ValueError('endereço não HTTPS')
              headers={'User-Agent':'RAF-TV-FACIL-Diagnostico/1.0','Accept':'*/*'}
              if segment: headers['Range']='bytes=0-1023'
              with opener.open(urllib.request.Request(url,headers=headers),timeout=9) as r:
                  if urllib.parse.urlsplit(r.geturl()).scheme != 'https': raise ValueError('redirecionamento não HTTPS')
                  return r.geturl(),r.read(1024 if segment else LIMIT+1),r.status
          
          def playlist(url, depth=0):
              if depth>3: raise ValueError('muitos níveis de playlist')
              final,data,code=get(url)
              if len(data)>LIMIT: raise ValueError('playlist maior que limite')
              lines=[x.strip() for x in data.decode('utf-8-sig',errors='replace').splitlines() if x.strip()]
              if not lines or lines[0]!='#EXTM3U': return 'NÃO HLS', f'HTTP {code}; resposta não é playlist M3U8'
              variants=[]
              for i,line in enumerate(lines[:-1]):
                  if line.startswith('#EXT-X-STREAM-INF:') and not lines[i+1].startswith('#'):
                      m=re.search(r'(?:[:,])BANDWIDTH=(\d+)',line)
                      variants.append((int(m.group(1)) if m else 0,lines[i+1]))
              if variants:
                  return playlist(urllib.parse.urljoin(final,sorted(variants)[0][1]),depth+1)
              if any(x.startswith('#EXT-X-KEY:') and 'METHOD=NONE' not in x for x in lines):
                  return 'PROTEGIDO/CRIPTOGRAFADO', 'Playlist acessível; reprodução não verificada'
              segs=[x for x in lines if not x.startswith('#')]
              if not segs: return 'HLS SEM SEGMENTOS','Playlist acessível, mas sem segmento de vídeo'
              _,sample,status=get(urllib.parse.urljoin(final,segs[-1]),True)
              if not sample: return 'SEGMENTO VAZIO',f'HTTP {status}'
              if sample.lstrip().lower().startswith((b'<html',b'<!doctype',b'{')): return 'SEGMENTO INVÁLIDO','Resposta parece HTML ou JSON'
              return 'HLS ACESSÍVEL',f'Playlist e amostra de segmento acessíveis (HTTP {status}); vídeo não decodificado'
          
          def test(job):
              n,name,source,url=job
              start=time.monotonic()
              try: status,detail=playlist(url)
              except urllib.error.HTTPError as e: status,detail='HTTP '+str(e.code),str(e.reason)
              except Exception as e: status,detail='FALHA DE CONEXÃO',str(e)[:180]
              return (n,name,source,status,detail,round(time.monotonic()-start,1))
          
          # Lista de testes; nao modifica canais.json.
          candidates = [
              (7, 'RedeTV! Mais (canal diferente)', 'https://cdn.live.br1.jmvstream.com/webtv/AVJ-15235/playlist/playlist.m3u8'),
              (7, 'RedeTV! Paraná (afiliada diferente)', 'https://tv01.zas.media:1936/redetvparana/redetvparana/playlist.m3u8'),
              (15, 'TV Senado - candidato', 'https://videos.senado.leg.br/live/tvsenado.m3u8'),
              (17, 'Canal Libras - candidato', 'https://canallibras-stream.ebc.com.br/index.m3u8'),
              (20, 'Canal Saúde - candidato', 'https://eitv7.cdn.broadpeak.io/account351-i1495/event/canalsaude/format720p.m3u8'),
              (26, 'TV Evangelizar - candidato A', 'https://tvevangelizar.brasilstream.com.br/hls/tvevangelizar/index.m3u8'),
              (26, 'TV Evangelizar - candidato B', 'https://cdn-tiva-tvevangelizar-brasilstream-com-br.smartbit.co/hls/tvevangelizar/index.m3u8'),
              (29, 'Pluto TV Bang Bang', 'https://jmp2.uk/plu-663b9dc7cb3ea10008f1a0ce.m3u8'),
              (35, 'Pluto TV Desenhos Clássicos', 'https://jmp2.uk/plu-655e5c4d2c46f3000877a54b.m3u8'),
              (36, 'Pluto TV Retrô', 'https://jmp2.uk/plu-5f1212ad1728050007a523b8.m3u8'),
              (38, 'Pluto TV Cine Clássicos', 'https://jmp2.uk/plu-5fa1612a669ba0000702017b.m3u8'),
              (39, 'Pluto TV Cine Trapalhões', 'https://jmp2.uk/plu-6a5520365badf45d3088b8d8.m3u8'),
              (40, 'Pluto TV Filmes Nacionais', 'https://jmp2.uk/plu-5f5a545d0dbf7f0007c09408.m3u8'),
              (41, 'Pluto TV Cine Família', 'https://jmp2.uk/plu-5f171f032cd22e0007f17f3d.m3u8'),
              (42, 'Popeye', 'https://jmp2.uk/plu-677d93f37bffa600080795e7.m3u8'),
              (43, 'Os Smurfs', 'https://jmp2.uk/plu-68b88ae1943f6fb1fb2ad749.m3u8'),
              (44, 'Inspetor Bugiganga', 'https://jmp2.uk/plu-69162648d03565d6c8c8df97.m3u8'),
              (45, 'MacGyver', 'https://jmp2.uk/plu-63eb9dc84e83e70008abea92.m3u8'),
              (46, 'A Feiticeira', 'https://jmp2.uk/plu-631fa8dd7f25240007099a40.m3u8'),
              (47, 'Mr. Bean', 'https://jmp2.uk/plu-69fca7dd2387729708faa32c.m3u8'),
          ]
          jobs=[(n,name,1,url) for n,name,url in candidates]
          channels=candidates
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              results=list(pool.map(test,jobs))
          headers=['Posição proposta','Nome','Fonte','Resultado','Detalhe','Segundos']
          with open('relatorio-canais.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.writer(f,delimiter=';'); w.writerow(headers); w.writerows(results)
          
          def esc(v): return str(v).replace('|','\\|').replace('\n',' ')
          lines=['# Diagnóstico de candidatos RAF TV FÁCIL','',f'{len(channels)} candidatos, {len(results)} fontes verificadas. Nenhuma alteração na lista publicada.', '', 'Teste executado no servidor GitHub, não no Brasil necessariamente. HLS acessível não garante imagem, som, autorização, nem disponibilidade no TV Box. Restrições regionais podem causar falso negativo.','', '| '+' | '.join(headers)+' |','|'+'|'.join(['---']*len(headers))+'|']
          lines += ['| '+' | '.join(map(esc,row))+' |' for row in results]
          report='\n'.join(lines)+'\n'
          Path('relatorio-canais.md').write_text(report,encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f: f.write(report)
          for row in results: print(*row,sep=' | ')
          PYTEST
      - uses: actions/upload-artifact@v4
        with:
          name: RAF-TV-FACIL-Relatorio-Fontes-Candidatas
          path: |
            relatorio-canais.csv
            relatorio-canais.md
          if-no-files-found: error
