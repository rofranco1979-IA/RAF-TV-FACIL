name: RAF TV FACIL - Verificar canais
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar fontes HLS da lista atual
        shell: bash
        run: |
          python - <<'PYTEST'
          import csv, json, re, urllib.request, urllib.error, urllib.parse, concurrent.futures, time, os
          from pathlib import Path
          
          LIMIT=1024*1024
          
          def get(url, segment=False):
              if urllib.parse.urlsplit(url).scheme != 'https':
                  raise ValueError('endereço não HTTPS')
              headers={'User-Agent':'RAF-TV-FACIL-Diagnostico/1.0','Accept':'*/*'}
              if segment: headers['Range']='bytes=0-1023'
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=9) as r:
                  if urllib.parse.urlsplit(r.geturl()).scheme != 'https': raise ValueError('redirecionamento não HTTPS')
                  return r.geturl(),r.read(1024 if segment else LIMIT+1),r.status
          
          def playlist(url, depth=0):
              if depth>3: raise ValueError('muitos níveis de playlist')
              final,data,code=get(url)
              if len(data)>LIMIT: raise ValueError('playlist maior que limite')
              lines=[x.strip() for x in data.decode('utf-8-sig',errors='replace').splitlines() if x.strip()]
              if not lines or lines[0]!='#EXTM3U': return 'NÃO HLS', f'HTTP {code}; resposta não é playlist M3U8'
              variants=[]
              for i,line in enumerate(lines[:-1]):
                  if line.startswith('#EXT-X-STREAM-INF:') and not lines[i+1].startswith('#'):
                      m=re.search(r'(?:[:,])BANDWIDTH=(\d+)',line)
                      variants.append((int(m.group(1)) if m else 0,lines[i+1]))
              if variants:
                  return playlist(urllib.parse.urljoin(final,sorted(variants)[0][1]),depth+1)
              if any(x.startswith('#EXT-X-KEY:') and 'METHOD=NONE' not in x for x in lines):
                  return 'PROTEGIDO/CRIPTOGRAFADO', 'Playlist acessível; reprodução não verificada'
              segs=[x for x in lines if not x.startswith('#')]
              if not segs: return 'HLS SEM SEGMENTOS','Playlist acessível, mas sem segmento de vídeo'
              _,sample,status=get(urllib.parse.urljoin(final,segs[-1]),True)
              if not sample: return 'SEGMENTO VAZIO',f'HTTP {status}'
              if sample.lstrip().lower().startswith((b'<html',b'<!doctype',b'{')): return 'SEGMENTO INVÁLIDO','Resposta parece HTML ou JSON'
              return 'HLS ACESSÍVEL',f'Playlist e amostra de segmento acessíveis (HTTP {status}); vídeo não decodificado'
          
          def test(job):
              n,name,source,url=job
              start=time.monotonic()
              try: status,detail=playlist(url)
              except urllib.error.HTTPError as e: status,detail='HTTP '+str(e.code),str(e.reason)
              except Exception as e: status,detail='FALHA DE CONEXÃO',str(e)[:180]
              return (n,name,source,status,detail,round(time.monotonic()-start,1))
          
          channels=json.loads(Path('canais.json').read_text(encoding='utf-8-sig'))['channels']
          jobs=[]
          for n,ch in enumerate(channels,1):
              urls=list(dict.fromkeys([ch['url']]+ch.get('alternatives',[])))[:3]
              for i,url in enumerate(urls,1): jobs.append((n,ch['name'],i,url))
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              results=list(pool.map(test,jobs))
          headers=['Canal','Nome','Fonte','Resultado','Detalhe','Segundos']
          with open('relatorio-canais.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.writer(f,delimiter=';'); w.writerow(headers); w.writerows(results)
          
          def esc(v): return str(v).replace('|','\\|').replace('\n',' ')
          lines=['# Diagnóstico RAF TV FÁCIL','',f'{len(channels)} canais, {len(results)} fontes verificadas.', '', 'Teste executado no servidor GitHub, não no Brasil necessariamente. HLS acessível não garante imagem, som, autorização, nem disponibilidade no TV Box. Restrições regionais podem causar falso negativo.','', '| '+' | '.join(headers)+' |','|'+'|'.join(['---']*len(headers))+'|']
          lines += ['| '+' | '.join(map(esc,row))+' |' for row in results]
          report='\n'.join(lines)+'\n'
          Path('relatorio-canais.md').write_text(report,encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f: f.write(report)
          for row in results: print(*row,sep=' | ')
          PYTEST
      - uses: actions/upload-artifact@v4
        with:
          name: RAF-TV-FACIL-Relatorio-Canais
          path: |
            relatorio-canais.csv
            relatorio-canais.md
          if-no-files-found: error
