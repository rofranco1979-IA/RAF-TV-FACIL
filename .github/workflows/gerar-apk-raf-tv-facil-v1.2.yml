        cat > 'README.md' <<'RAF_FILE_8'
        # RAF TV FÁCIL 1.2 — protótipo Android TV / TV Box
        Aplicativo separado, sem cadastro, sem alteração do RAF STREAMING. Android 6+ (API 23), player HLS Media3.

        ## Instalação de teste
        1. Gere o APK pelo workflow manual do GitHub Actions. Baixe o artefato ZIP, extraia e instale o APK no aparelho.
        2. Abra o aplicativo. Setas trocam canal; OK abre a lista; Voltar alterna lista e TV. Volume usa o controle do aparelho.
        3. Para abrir automaticamente, na lista mantenha OK pressionado sobre um canal (ou MENU duas vezes, ou toque longo no título). Selecione Abrir TV ao ligar o aparelho. Selecione RAF TV FÁCIL como aplicativo de início (Home), **somente se o aparelho disponibilizar essa escolha**. Para desfazer, retorne às configurações de Home e escolha o launcher anterior. Não há bloqueio de sistema nem garantia de abertura automática em qualquer aparelho.

        ## Categorias e atualização
        OK abre categorias; escolha uma ou Todos os canais. Voltar retorna às categorias e à TV. Atualizar lista fica no rodapé; mantenha OK pressionado nesse botão para acessar o instalador. O JSON aceita category e alternatives (até dois HTTPS adicionais por canal), sem alterar o formato antigo. A troca de fonte é automática após falhas; não foram adicionados novos sinais nesta versão.

        ## Limitações
        Sete entradas experimentais de fontes públicas ou associadas a emissoras, sem autorização individual confirmada; somente TV Câmara foi testada pelo usuário na versão anterior. TV Câmara 2 pode não transmitir 24h. Não incluir espelhos desconhecidos. TV Aparecida requer autorização expressa. Os cartões usam nomes e cores próprias, sem logotipos oficiais. A lista remota opcional lê canais.json na raiz do repositório ao abrir; mantém cache ou lista inicial se falhar. Formato: objeto JSON com array channels contendo name e url HTTPS HLS. Até 200 entradas. Não use listas sem autorização. A TV Câmara fornece oficialmente player incorporável em https://www.camara.leg.br/tv/como-sintonizar. Verifique autorização/condições de uso de cada emissora antes de distribuir; substitua/remova fontes não aprovadas. Não há retransmissão por servidor próprio. O APK de depuração é para teste, não distribuição comercial; versões de produção devem usar chave de assinatura persistente.
        RAF_FILE_8
    - name: Instalar SDK e compilar
      shell: bash
      run: |
        set -eu
        SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
        fi
        test -x "$SDKMANAGER"
        export ANDROID_HOME="$SDK_ROOT" ANDROID_SDK_ROOT="$SDK_ROOT"
        # GitHub runner normally has accepted licenses; accept any remaining SDK licenses.
        set +o pipefail
        yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
        set -o pipefail
        "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
        cd raf-tv-facil
        gradle --no-daemon :app:assembleDebug
        mkdir -p ../dist
        cp app/build/outputs/apk/debug/app-debug.apk ../dist/RAF-TV-FACIL-V1.2-Android-TV.apk
    - uses: actions/upload-artifact@v4
      with:
        name: RAF-TV-FACIL-V1.2-Android-TV
        path: dist/RAF-TV-FACIL-V1.2-Android-TV.apk
        if-no-files-found: error
