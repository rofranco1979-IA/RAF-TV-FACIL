name: RAF TV FACIL V1.2 - Gerar APK
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Criar projeto independente
      shell: bash
      run: |
        set -eu
        mkdir -p raf-tv-facil
        cd raf-tv-facil
        mkdir -p '.'
        cat > 'settings.gradle' <<'RAF_FILE_0'
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = 'RAF-TV-FACIL'
        include ':app'
        RAF_FILE_0
        mkdir -p '.'
        cat > 'build.gradle' <<'RAF_FILE_1'
        plugins { id 'com.android.application' version '8.7.3' apply false }
        RAF_FILE_1
        mkdir -p '.'
        cat > 'gradle.properties' <<'RAF_FILE_2'
        android.useAndroidX=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        RAF_FILE_2
        mkdir -p 'app'
        cat > 'app/build.gradle' <<'RAF_FILE_3'
        plugins { id 'com.android.application' }
        android {
         namespace 'br.com.raf.tvfacil'
         compileSdk 35
         defaultConfig { applicationId 'br.com.raf.tvfacil'; minSdk 23; targetSdk 34; versionCode 4; versionName '1.2' }
         compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
        }
        dependencies {
         implementation 'androidx.media3:media3-exoplayer:1.4.1'
         implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
         implementation 'androidx.media3:media3-ui:1.4.1'
        }
        RAF_FILE_3
        mkdir -p 'app/src/main'
        cat > 'app/src/main/AndroidManifest.xml' <<'RAF_FILE_4'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
         <uses-permission android:name="android.permission.INTERNET"/>
         <uses-feature android:name="android.software.leanback" android:required="false"/>
         <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
         <application android:label="RAF TV FÁCIL" android:icon="@drawable/tv_icon" android:banner="@drawable/tv_banner" android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen" android:allowBackup="false" android:usesCleartextTraffic="false">
          <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape" android:launchMode="singleTask">
           <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
           <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent-filter>
          </activity>
          <activity-alias android:name=".HomeTV" android:targetActivity=".MainActivity" android:exported="true" android:label="RAF TV FÁCIL">
           <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.HOME"/><category android:name="android.intent.category.DEFAULT"/></intent-filter>
          </activity-alias>
         </application>
        </manifest>
        RAF_FILE_4
        mkdir -p 'app/src/main/res/drawable'
        cat > 'app/src/main/res/drawable/tv_icon.xml' <<'RAF_FILE_5'
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="96dp" android:height="96dp" android:viewportWidth="96" android:viewportHeight="96">
        <path android:fillColor="#142C50" android:pathData="M0,0H96V96H0Z"/><path android:fillColor="#FFFFFF" android:pathData="M12,23H84V72H12Z"/><path android:fillColor="#245BC1" android:pathData="M18,29H78V66H18Z"/><path android:fillColor="#FFFFFF" android:pathData="M40,36L62,48L40,60Z M30,77H66V82H30Z"/></vector>
        RAF_FILE_5
        mkdir -p 'app/src/main/res/drawable'
        cat > 'app/src/main/res/drawable/tv_banner.xml' <<'RAF_FILE_6'
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="320dp" android:height="180dp" android:viewportWidth="320" android:viewportHeight="180">
        <path android:fillColor="#142C50" android:pathData="M0,0H320V180H0Z"/><path android:fillColor="#FFFFFF" android:pathData="M69,26H251V139H69Z M125,148H195V156H125Z"/><path android:fillColor="#245BC1" android:pathData="M79,36H241V129H79Z"/><path android:fillColor="#FFFFFF" android:pathData="M143,54L190,82L143,110Z"/></vector>
        RAF_FILE_6
        mkdir -p 'app/src/main/java/br/com/raf/tvfacil'
        cat > 'app/src/main/java/br/com/raf/tvfacil/MainActivity.java' <<'RAF_FILE_7'
        package br.com.raf.tvfacil;
        
        import android.app.*;
        import android.os.*;
        import android.content.*;
        import android.graphics.Color;
        import android.graphics.drawable.GradientDrawable;
        import android.view.*;
        import android.widget.*;
        import android.provider.Settings;
        import android.text.InputType;
        import org.json.*;
        import java.net.URL;
        import javax.net.ssl.HttpsURLConnection;
        import java.io.*;
        import java.nio.charset.StandardCharsets;
        import java.util.ArrayList;
        import java.util.HashSet;
        import java.util.LinkedHashSet;
        import androidx.media3.common.*;
        import androidx.media3.exoplayer.ExoPlayer;
        import androidx.media3.ui.PlayerView;
        
        public class MainActivity extends Activity {
            // Grade experimental, sem retransmissão própria.
            private String[] names = {"TV Câmara", "TV Brasil", "TV Senado", "Canal Gov", "TV Cultura", "Canal Libras", "TV Câmara 2"};
            private String[] urls = {
                "https://stream3.camara.gov.br/tv1/manifest.m3u8",
                "https://tvbrasil-stream.ebc.com.br/index.m3u8",
                "https://stream3.camara.gov.br/tvsenado/manifest.m3u8",
                "https://canalgov-stream.ebc.com.br/index.m3u8",
                "https://player-tvcultura.stream.uol.com.br/live/tvcultura.m3u8",
                "https://canallibras-stream.ebc.com.br/mux_video_ts/index-1.m3u8",
                "https://stream3.camara.gov.br/tv2/manifest.m3u8"
            };
            private static final String DEFAULT_LIST = "https://raw.githubusercontent.com/rofranco1979-IA/RAF-TV-FACIL/main/canais.json";
            private static final int[] TILE_COLORS={0xFF294F78,0xFF276047,0xFF46517B,0xFF63512E,0xFF385D68,0xFF51446E};
            private int index = 0, attempts = 0, refreshGeneration = 0;
            private String[] categories = {"Públicos e educativos", "Públicos e educativos", "Públicos e educativos", "Públicos e educativos", "TV aberta", "Públicos e educativos", "Públicos e educativos"};
            private String[][] alternatives = new String[7][];
            private int sourceIndex = 0;
            private String menuCategory = null;
            private static final String ALL = "Todos os canais";
            private static final String[] CATEGORY_ORDER = {"TV aberta", "Notícias", "Filmes e faroeste", "Desenhos", "Séries e comédia", "Religiosos", "Públicos e educativos", "Outros"};
            private static final int[] CATEGORY_COLORS = {0xFF164C91,0xFF455A64,0xFFA33131,0xFF875409,0xFF684098,0xFF176344,0xFF126478,0xFF39485A};
            private String displayName(String name){
                String[] prefixes={"TV · ","Notícias · ","Filmes · ","Desenhos · ","Séries · ","Fé · ","Públicos · "};
                for(String prefix:prefixes)if(name.startsWith(prefix))return name.substring(prefix.length());
                return name;
            }
            private String inferCategory(String raw){
                String n=displayName(raw);
                switch(n){
                    case "Globo SP (teste)": return "TV aberta";
                    case "TV TEM Sorocaba (teste)": return "TV aberta";
                    case "SBT TVS+ Sorocaba (teste)": return "TV aberta";
                    case "Record SP (teste)": return "TV aberta";
                    case "SBT Interior": return "TV aberta";
                    case "Band": return "TV aberta";
                    case "RedeTV!": return "TV aberta";
                    case "TV Cultura": return "TV aberta";
                    case "TV Gazeta": return "TV aberta";
                    case "Rede Brasil": return "TV aberta";
                    case "SBT RJ": return "TV aberta";
                    case "Globo - TV Morena": return "TV aberta";
                    case "Record": return "TV aberta";
                    case "Record News": return "Notícias";
                    case "SBT News": return "Notícias";
                    case "Pluto TV Bang Bang": return "Filmes e faroeste";
                    case "Pluto TV Cine Clássicos": return "Filmes e faroeste";
                    case "Pluto TV Cine Trapalhões": return "Filmes e faroeste";
                    case "Pluto TV Filmes Nacionais": return "Filmes e faroeste";
                    case "Pluto TV Cine Família": return "Filmes e faroeste";
                    case "Runtime TV e Filmes": return "Filmes e faroeste";
                    case "Runtime Ação": return "Filmes e faroeste";
                    case "Runtime Comédia": return "Filmes e faroeste";
                    case "Runtime Família": return "Filmes e faroeste";
                    case "Runtime Romance": return "Filmes e faroeste";
                    case "Pluto TV Desenhos Clássicos": return "Desenhos";
                    case "Popeye": return "Desenhos";
                    case "Os Smurfs": return "Desenhos";
                    case "Inspetor Bugiganga": return "Desenhos";
                    case "Toon Goggles Brasil (teste)": return "Desenhos";
                    case "Pluto TV Retrô": return "Séries e comédia";
                    case "MacGyver": return "Séries e comédia";
                    case "A Feiticeira": return "Séries e comédia";
                    case "Mr. Bean": return "Séries e comédia";
                    case "Rede Gospel": return "Religiosos";
                    case "TV Evangelizar": return "Religiosos";
                    case "TV Pai Eterno": return "Religiosos";
                    case "TV Câmara": return "Públicos e educativos";
                    case "TV Brasil": return "Públicos e educativos";
                    case "TV Senado": return "Públicos e educativos";
                    case "Canal Gov": return "Públicos e educativos";
                    case "Canal Libras": return "Públicos e educativos";
                    case "TV Câmara 2": return "Públicos e educativos";
                    case "Canal Educação": return "Públicos e educativos";
                    case "Canal Saúde": return "Públicos e educativos";
                    case "Rede Minas": return "Públicos e educativos";
                    case "TVE RS": return "Públicos e educativos";
                    case "Globo SP": return "TV aberta";
                    case "TV TEM Sorocaba": return "TV aberta";
                    case "SBT TVS+ Sorocaba": return "TV aberta";
                    case "Record SP": return "TV aberta";
                    case "Grjngo - Faroeste (teste)": return "Filmes e faroeste";
                    case "Retro Cartoon (teste)": return "Desenhos";
                    case "Series Classic (teste)": return "Séries e comédia";
                    default: return "Outros";
                }
            }
            private String validCategory(String value,String name){
                for(String c:CATEGORY_ORDER)if(c.equals(value))return c;
                return inferCategory(name);
            }
            private int categoryColor(String c){for(int i=0;i<CATEGORY_ORDER.length;i++)if(CATEGORY_ORDER[i].equals(c))return CATEGORY_COLORS[i];return 0xFF39485A;}
            private String[] sources(int i){
                if(alternatives[i]!=null)return alternatives[i];
                return new String[]{urls[i]};
            }
            private void saveLast(){getPreferences(MODE_PRIVATE).edit().putInt("last",index).putString("last_name",names[index]).putString("last_url",urls[index]).apply();}
            private int findChannel(String name,String url,int fallback){
                for(int i=0;i<names.length;i++)if(names[i].equals(name))return i;
                for(int i=0;i<names.length;i++)if(displayName(names[i]).equals(displayName(name)))return i;
                if(!url.isEmpty())for(int i=0;i<urls.length;i++)if(urls[i].equals(url))return i;
                return Math.max(0,Math.min(names.length-1,fallback));
            }
            private boolean active = false;
            private final Runnable reconnect = () -> {
                if (active && this.player != null) startPlayback();
            };
            private FrameLayout root;
            private PlayerView video;
            private ExoPlayer player;
            private TextView status, banner;
            private LinearLayout panel;
            private final Handler handler = new Handler(Looper.getMainLooper());
            private final Runnable hideBanner = () -> { if (banner != null) banner.setVisibility(View.GONE); };
            private final Runnable timeout = () -> { if (player != null && player.getPlaybackState() != Player.STATE_READY) scheduleRetry(); };
            private int dp(float n) { return (int)(n * getResources().getDisplayMetrics().density + .5f); }
            @Override public void onCreate(Bundle b) {
                super.onCreate(b);
                getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                try { applyList(getPreferences(MODE_PRIVATE).getString("cached_list", "")); } catch(Exception ignored) {}
                String lastName = getPreferences(MODE_PRIVATE).getString("last_name", "");
                index = Math.max(0, Math.min(names.length-1, getPreferences(MODE_PRIVATE).getInt("last", 0)));
                index=findChannel(lastName,getPreferences(MODE_PRIVATE).getString("last_url", ""),index);
                root = new FrameLayout(this); root.setBackgroundColor(Color.BLACK);
                video = new PlayerView(this); video.setUseController(false); video.setFocusable(false);
                video.setOnClickListener(v -> toggleMenu());
                root.addView(video, new FrameLayout.LayoutParams(-1,-1));
                status = label("", 26); status.setGravity(Gravity.CENTER); status.setBackgroundColor(0xDC101C2E); status.setPadding(dp(18),dp(16),dp(18),dp(16));
                FrameLayout.LayoutParams st = new FrameLayout.LayoutParams(-1,-2,Gravity.CENTER); st.setMargins(dp(24),0,dp(24),0);
                root.addView(status,st); status.setVisibility(View.GONE);
                banner = label("", 25); banner.setBackgroundColor(0xE0101C2E); banner.setPadding(dp(20),dp(16),dp(20),dp(16));
                FrameLayout.LayoutParams bp = new FrameLayout.LayoutParams(-1,-2,Gravity.BOTTOM); root.addView(banner,bp); banner.setVisibility(View.GONE);
                setContentView(root); immersive();
            }
            private TextView label(String text, int size) { TextView t = new TextView(this); t.setText(text); t.setTextSize(size); t.setTextColor(Color.WHITE); return t; }
            private void immersive() { getWindow().getDecorView().setSystemUiVisibility(5894 | View.SYSTEM_UI_FLAG_LAYOUT_STABLE); }
            @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if(f) immersive(); }
            @Override protected void onStart() { super.onStart(); active=true; if(player==null) {
                player=new ExoPlayer.Builder(this).build(); video.setPlayer(player);
                player.addListener(new Player.Listener(){
                    @Override public void onPlaybackStateChanged(int s) {
                        if(s==Player.STATE_READY) { handler.removeCallbacks(timeout); handler.removeCallbacks(reconnect); attempts=0; status.setVisibility(View.GONE); }
                        else if(s==Player.STATE_BUFFERING) { showStatus("Carregando " + names[index] + "…"); handler.removeCallbacks(timeout); handler.postDelayed(timeout,20000); }
                        else if(s==Player.STATE_ENDED) scheduleRetry();
                    }
                    @Override public void onPlayerError(PlaybackException e) { scheduleRetry(); }
                });
                tune(index);
                refreshList(false);
            }}
            @Override protected void onStop() { active=false; handler.removeCallbacksAndMessages(null); if(player!=null){video.setPlayer(null);player.release();player=null;} refreshGeneration++; super.onStop(); }
            private void showStatus(String text){ status.setText(text);status.setVisibility(View.VISIBLE); }
            private void tune(int n){
                attempts=0; sourceIndex=0; handler.removeCallbacks(reconnect); handler.removeCallbacks(timeout);
                index=(n+names.length)%names.length; saveLast();
                banner.setText(String.format(java.util.Locale.ROOT,"%02d   %s     •     ↑ ↓ Trocar     •     OK Canais",index+1,displayName(names[index]))); banner.setVisibility(View.VISIBLE);
                handler.removeCallbacks(hideBanner);handler.postDelayed(hideBanner,4500);
                startPlayback();
            }
            private void startPlayback(){
                if(player==null || !active)return;
                handler.removeCallbacks(timeout); handler.removeCallbacks(reconnect);
                showStatus("Carregando " + names[index] + "…");
                player.setMediaItem(new MediaItem.Builder().setUri(sources(index)[sourceIndex]).setMimeType(MimeTypes.APPLICATION_M3U8).build());
                player.prepare();player.play();handler.removeCallbacks(timeout);handler.postDelayed(timeout,20000);
            }
            private GradientDrawable bg(int color){GradientDrawable g=new GradientDrawable();g.setColor(color);g.setCornerRadius(dp(10));return g;}
            private Button action(String name, Runnable run){return action(name,0xFF26394F,run);}
            private Button action(String name,int color,Runnable run){
                Button b=new Button(this);b.setText(name);b.setAllCaps(false);b.setTextSize(23);b.setTextColor(Color.WHITE);b.setMinHeight(dp(52));b.setFocusable(true);b.setFocusableInTouchMode(true);b.setId(View.generateViewId());b.setBackground(bg(color));
                b.setOnFocusChangeListener((v,f)->{ b.setBackground(bg(f?0xFF245BC1:color)); if(f){GradientDrawable focused=bg(0xFF245BC1);focused.setStroke(dp(3),Color.WHITE);b.setBackground(focused);} });b.setOnClickListener(v->run.run());return b;
            }
            private void closeMenu(){if(panel!=null){root.removeView(panel);panel=null;} menuCategory=null; immersive();}
            private void toggleMenu(){if(panel!=null)closeMenu();else openMenu();}
            private void openMenu(){showMenu(null);}
            private void showMenu(String category){
                closeMenu();menuCategory=category;
                panel=new LinearLayout(this);panel.setOrientation(LinearLayout.VERTICAL);panel.setPadding(dp(20),dp(10),dp(20),dp(8));panel.setBackgroundColor(0xFF101C2E);panel.setClickable(true);
                root.addView(panel,new FrameLayout.LayoutParams(-1,-1));
                TextView title=label(category==null?"RAF TV FÁCIL — Categorias":category,27);panel.addView(title);
                title.setOnLongClickListener(v->{installer();return true;});
                ScrollView scroll=new ScrollView(this);panel.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));
                LinearLayout list=new LinearLayout(this);list.setOrientation(LinearLayout.VERTICAL);scroll.addView(list);
                ArrayList<Button> buttons=new ArrayList<>();Button selected=null;
                if(category==null){
                    Button all=action(ALL+"  ("+names.length+")",0xFF39485A,()->showMenu(ALL));buttons.add(all);selected=all;
                    for(String c:CATEGORY_ORDER){int count=0;for(String cc:categories)if(c.equals(cc))count++;if(count==0)continue;
                        final String choice=c;
                        Button btn=action(c+"  ("+count+")",categoryColor(c),()->showMenu(choice));buttons.add(btn);
                        if(c.equals(categories[index]))selected=btn;
                    }
                }else{
                    for(int i=0;i<names.length;i++){
                        if(!ALL.equals(category)&&!category.equals(categories[i]))continue;
                        final int ch=i;Button btn=action(String.format(java.util.Locale.ROOT,"%02d   %s",i+1,displayName(names[i])),categoryColor(categories[i]),()->{closeMenu();tune(ch);});
                        btn.setOnLongClickListener(v->{installer();return true;});buttons.add(btn);if(i==index)selected=btn;
                    }
                }
                LinearLayout row=null;
                for(int i=0;i<buttons.size();i++){
                    if(i%2==0){row=new LinearLayout(this);row.setOrientation(LinearLayout.HORIZONTAL);list.addView(row,new LinearLayout.LayoutParams(-1,-2));}
                    Button btn=buttons.get(i);btn.setTextSize(22);btn.setMinHeight(dp(68));btn.setMaxLines(2);
                    LinearLayout.LayoutParams cell=new LinearLayout.LayoutParams(0,-2,1);cell.setMargins(dp(5),dp(4),dp(5),dp(4));row.addView(btn,cell);
                }
                LinearLayout footer=new LinearLayout(this);footer.setOrientation(LinearLayout.HORIZONTAL);panel.addView(footer,new LinearLayout.LayoutParams(-1,-2));
                Button back=action(category==null?"Voltar à TV":"Categorias",()->{if(category==null)closeMenu();else openMenu();});
                Button refresh=action("Atualizar lista",()->refreshList(true));refresh.setOnLongClickListener(v->{installer();return true;});
                footer.addView(back,new LinearLayout.LayoutParams(0,-2,1));footer.addView(refresh,new LinearLayout.LayoutParams(0,-2,1));
                if(selected!=null)selected.requestFocus();else if(!buttons.isEmpty())buttons.get(0).requestFocus();else back.requestFocus();
            }
            private void addButton(LinearLayout container,Button b){LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);lp.setMargins(0,dp(6),0,0);container.addView(b,lp);}
            private void scheduleRetry(){
                handler.removeCallbacks(timeout);handler.removeCallbacks(reconnect);
                if(!active || player==null)return;
                if(attempts>=2){
                    if(sourceIndex+1<sources(index).length){sourceIndex++;attempts=0;showStatus("Tentando outra fonte…");handler.postDelayed(reconnect,1500);return;}
                    showStatus("Canal indisponível.\nUse as setas para trocar ou OK para escolher.");return;
                }
                int delay=3*(++attempts);
                showStatus("Reconectando " + names[index] + "…\nAguarde ou troque de canal.");
                handler.postDelayed(reconnect,delay*1000L);
            }
            private void installer(){
                new AlertDialog.Builder(this).setTitle("Configuração do instalador")
                    .setItems(new String[]{"Abrir TV ao ligar o aparelho","Atualizar canais agora","Endereço da lista de canais"},(d,w)->{
                        if(w==0)setupHome();else if(w==1)refreshList(true);else editListUrl();
                    }).setNegativeButton("Voltar",null).show();
            }
            private void editListUrl(){
                EditText input=new EditText(this);input.setSingleLine(true);input.setInputType(InputType.TYPE_CLASS_TEXT|InputType.TYPE_TEXT_VARIATION_URI);
                input.setText(getPreferences(MODE_PRIVATE).getString("list_url",DEFAULT_LIST));
                new AlertDialog.Builder(this).setTitle("Lista HTTPS autorizada (JSON)").setView(input).setNegativeButton("Cancelar",null).setPositiveButton("Salvar",(d,w)->{
                    String value=input.getText().toString().trim();
                    if(!validHttps(value)){Toast.makeText(this,"Use um endereço HTTPS válido",Toast.LENGTH_LONG).show();return;}
                    getPreferences(MODE_PRIVATE).edit().putString("list_url",value).apply();refreshList(true);
                }).show();
            }
            private boolean validHttps(String u){try{URL parsed=new URL(u);return "https".equalsIgnoreCase(parsed.getProtocol()) && parsed.getHost()!=null&&!parsed.getHost().isEmpty()&&parsed.getUserInfo()==null;}catch(Exception e){return false;}}
            private boolean applyList(String data) throws Exception{
                JSONArray array=new JSONObject(data).getJSONArray("channels");
                if(array.length()<1||array.length()>200)return false;
                ArrayList<String> nn=new ArrayList<>(), uu=new ArrayList<>(), cc=new ArrayList<>();ArrayList<String[]> ss=new ArrayList<>();HashSet<String> seen=new HashSet<>();
                for(int i=0;i<array.length();i++){
                    JSONObject o=array.getJSONObject(i);String n=o.getString("name").trim(),u=o.getString("url").trim();
                    if(n.isEmpty()||n.length()>60||!validHttps(u)||!seen.add(n))return false;
                    nn.add(n);uu.add(u);cc.add(validCategory(o.optString("category", ""),n));
                    LinkedHashSet<String> candidates=new LinkedHashSet<>();candidates.add(u);
                    JSONArray extra=o.optJSONArray("alternatives");
                    if(extra!=null)for(int k=0;k<extra.length()&&candidates.size()<3;k++){String alt=extra.optString(k,"").trim();if(validHttps(alt))candidates.add(alt);}
                    ss.add(candidates.toArray(new String[0]));
                }
                names=nn.toArray(new String[0]);urls=uu.toArray(new String[0]);categories=cc.toArray(new String[0]);alternatives=ss.toArray(new String[0][]);return true;
            }
            private void refreshList(boolean manual){
                final int request=++refreshGeneration;
                if(manual)Toast.makeText(this,"Atualizando lista…",Toast.LENGTH_SHORT).show();
                final String address=getPreferences(MODE_PRIVATE).getString("list_url",DEFAULT_LIST);
                new Thread(()->{
                    try{
                        if(!validHttps(address))throw new IOException();
                        HttpsURLConnection c=(HttpsURLConnection)new URL(address).openConnection();
                        c.setUseCaches(false);c.setRequestProperty("Cache-Control","no-cache");c.setConnectTimeout(7000);c.setReadTimeout(7000);c.setInstanceFollowRedirects(false);
                        String data;
                        try{
                            if(c.getResponseCode()!=200)throw new IOException();
                            try(InputStream in=c.getInputStream();ByteArrayOutputStream out=new ByteArrayOutputStream()){
                                byte[] buf=new byte[4096];int count;while((count=in.read(buf))!=-1){out.write(buf,0,count);if(out.size()>262144)throw new IOException();}
                                data=new String(out.toByteArray(),StandardCharsets.UTF_8);
                            }
                        }finally{c.disconnect();}
                        runOnUiThread(()->{
                            if(!active||request!=refreshGeneration)return;
                            String old=names[index],oldUrl=urls[index];String[] oldSources=sources(index);int oldIndex=index;String oldMenu=menuCategory;
                            try{
                                if(!applyList(data))throw new IOException();
                                getPreferences(MODE_PRIVATE).edit().putString("cached_list",data).apply();
                                index=findChannel(old,oldUrl,oldIndex);
                                if(!oldUrl.equals(urls[index])||!java.util.Arrays.equals(oldSources,sources(index)))tune(index);
                                else saveLast();
                                if(panel!=null)showMenu(oldMenu);
                                if(manual)Toast.makeText(this,"Lista atualizada: "+names.length+" canais",Toast.LENGTH_LONG).show();
                            }catch(Exception e){if(manual)Toast.makeText(this,"Lista inválida. Mantivemos os canais anteriores.",Toast.LENGTH_LONG).show();}
                        });
                    }catch(Exception e){runOnUiThread(()->{if(active&&request==refreshGeneration&&manual)Toast.makeText(this,"Não foi possível atualizar. Canais anteriores mantidos.",Toast.LENGTH_LONG).show();});}
                }).start();
            }
            private void setupHome(){
                new AlertDialog.Builder(this).setTitle("Abrir a TV ao ligar")
                  .setMessage("Se o aparelho permitir, escolha RAF TV FÁCIL como app de início (Home). Assim, a TV abrirá quando o aparelho carregar sua tela inicial. Para voltar ao menu original do aparelho, altere novamente o app de início nas configurações. Alguns TV Boxes não oferecem essa opção.")
                  .setNegativeButton("Cancelar",null).setPositiveButton("Abrir configuração",(d,w)->{
                      try{ startActivity(new Intent(Settings.ACTION_HOME_SETTINGS)); }
                      catch(ActivityNotFoundException e){ try{startActivity(new Intent(Settings.ACTION_SETTINGS));}catch(Exception ignored){Toast.makeText(this,"Configuração não disponível neste aparelho",Toast.LENGTH_LONG).show();} }
                  }).show();
            }
            @Override public boolean dispatchKeyEvent(KeyEvent e){
                int k=e.getKeyCode();boolean down=e.getAction()==KeyEvent.ACTION_DOWN;
                if(k==KeyEvent.KEYCODE_CHANNEL_UP || k==KeyEvent.KEYCODE_CHANNEL_DOWN){if(down&&e.getRepeatCount()==0){closeMenu();tune(index+(k==KeyEvent.KEYCODE_CHANNEL_UP?1:-1));}return true;}
                if(k==KeyEvent.KEYCODE_MENU){if(down&&e.getRepeatCount()==0){if(panel==null)openMenu();else installer();}return true;}
                if(panel==null){
                    if(k==KeyEvent.KEYCODE_DPAD_UP||k==KeyEvent.KEYCODE_DPAD_RIGHT||k==KeyEvent.KEYCODE_DPAD_DOWN||k==KeyEvent.KEYCODE_DPAD_LEFT){if(down&&e.getRepeatCount()==0)tune(index+((k==KeyEvent.KEYCODE_DPAD_UP||k==KeyEvent.KEYCODE_DPAD_RIGHT)?1:-1));return true;}
                    if(k==KeyEvent.KEYCODE_DPAD_CENTER||k==KeyEvent.KEYCODE_ENTER||k==KeyEvent.KEYCODE_MENU){if(down&&e.getRepeatCount()==0)openMenu();return true;}
                }
                return super.dispatchKeyEvent(e);
            }
            @Override public void onBackPressed(){if(panel!=null){if(menuCategory!=null)openMenu();else closeMenu();}else openMenu();}
        }
