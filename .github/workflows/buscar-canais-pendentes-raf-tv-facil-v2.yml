name: RAF TV FACIL - Buscar canais pendentes V2
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  buscar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recuperar resultados da primeira busca
        uses: actions/download-artifact@v4
        with:
          name: RAF-TV-FACIL-Relatorio-Busca-Canais
          run-id: '45872232271'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: historico-anterior
      - name: Buscar e testar fontes pendentes
        shell: bash
        run: |
          python - <<'PYTEST'
          import csv, json, re, urllib.request, urllib.error, urllib.parse, concurrent.futures, time, os, socket, ipaddress, unicodedata
          from pathlib import Path
          CATALOGS = {
           'IPTV-ORG': 'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/br.m3u',
           'Free-TV': 'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_brazil.m3u8',
           'IPTV-COM': 'https://raw.githubusercontent.com/iptv-com/iptv/main/lists/brazil.m3u',
           'CatTV': 'https://raw.githubusercontent.com/SamuelSantos-R/cattv-playlist/main/playlist/br.m3u',
           'Nexonic': 'https://raw.githubusercontent.com/nexonic-technologies/nexonic-iptv/main/playlists/countries/br.m3u',
           'Legal Free IPTV': 'https://biskyt.github.io/legalFreeIPTVplaylist/languages/por.m3u',
          }
          LIMIT=1024*1024

          def check_url(url):
              p=urllib.parse.urlsplit(url)
              if p.scheme!='https' or not p.hostname or p.username or p.password:
                  raise ValueError('HTTPS público sem credenciais exigido')
              if any(not ipaddress.ip_address(a[4][0]).is_global for a in socket.getaddrinfo(p.hostname,p.port or 443,type=socket.SOCK_STREAM)):
                  raise ValueError('endereço não público recusado')
              return p

          class PublicRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  check_url(newurl)
                  return super().redirect_request(req,fp,code,msg,headers,newurl)

          def get(url, segment=False, limit=LIMIT):
              check_url(url)
              headers={'User-Agent':'RAF-TV-FACIL-Diagnostico/1.0','Accept':'*/*'}
              if segment: headers['Range']='bytes=0-1023'
              opener=urllib.request.build_opener(PublicRedirect())
              with opener.open(urllib.request.Request(url,headers=headers),timeout=9) as r:
                  check_url(r.geturl())
                  return r.geturl(),r.read(1024 if segment else limit+1),r.status

          def norm(s):
              return ''.join(c for c in unicodedata.normalize('NFKD',s.casefold()) if not unicodedata.combining(c))

          def classify(name, group):
              n=norm(name+' '+group)
              if re.search(r'\b(globo|tv\s*tem|sbt|record|band|bandeirantes|redetv)\b',n) and not re.search(r'\b(news|noticias)\b',n): return 0,'TV aberta'
              if re.search(r'filme|movie|cinema|faroeste|western|mazzaropi|patetas|laurel|hardy|classico',n): return 1,'Filmes e faroeste'
              if re.search(r'desenho|cartoon|kids|infantil|popeye|smurf|animacao',n): return 2,'Desenhos'
              if re.search(r'serie|sitcom|comedia|retro|macgyver|bean|feiticeira',n): return 3,'Séries e comédia'
              if re.search(r'news|noticias|jornal',n): return 4,'Notícias'
              if re.search(r'public|educa|camara|senado|universit|cultura',n): return 5,'Públicos e educativos'
              if re.search(r'igreja|relig|gospel|catolic|evangel|fe\b',n): return 6,'Religiosos'
              return 7,'TV aberta'

          def parse_m3u(data):
              meta=None
              for line in data.splitlines():
                  line=line.strip()
                  if line.startswith('#EXTINF:'):
                      # Ignore explicit restricted channels; do not spoof headers or bypass region controls.
                      name=line.split(',',1)[-1].strip()
                      group=re.search(r'group-title="([^"]*)"',line,re.I)
                      meta=(name, group.group(1) if group else '',line)
                  elif line and not line.startswith('#'):
                      if meta:
                          name,group,raw=meta
                          p=urllib.parse.urlsplit(line)
                          bad=re.search(r'geo.?blocked|geo.?restricted|subscription|pay.?tv|\bdrm\b|adult|xxx|\b18\+|\bporn',norm(raw))
                          # HLS only; skip credential-like URLs and non-HTTPS.
                          if not bad and p.scheme=='https' and p.hostname and not p.username and not p.password and re.search(r'\.m3u8(?:$|[/?])',p.path,re.I) and not re.search(r'(?:^|&)(?:token|auth|password|username|key|signature|sig|jwt|hdnea|hdnts)=',p.query,re.I):
                              yield name,group,line
                      meta=None

          def playlist(url, depth=0):
              if depth>3: raise ValueError('muitos níveis de playlist')
              final,data,code=get(url)
              if len(data)>LIMIT: raise ValueError('playlist maior que limite')
              lines=[x.strip() for x in data.decode('utf-8-sig',errors='replace').splitlines() if x.strip()]
              if not lines or lines[0]!='#EXTM3U': return 'NÃO HLS'
              if any(x.startswith(('#EXT-X-KEY:','#EXT-X-SESSION-KEY:')) and 'METHOD=NONE' not in x for x in lines): return 'CRIPTOGRAFADO - NÃO TESTADO'
              variants=[]
              for i,line in enumerate(lines[:-1]):
                  if line.startswith('#EXT-X-STREAM-INF:') and not lines[i+1].startswith('#'):
                      m=re.search(r'(?:[:,])BANDWIDTH=(\d+)',line)
                      variants.append((int(m.group(1)) if m else 0,lines[i+1]))
              if variants: return playlist(urllib.parse.urljoin(final,sorted(variants)[0][1]),depth+1)
              segs=[x for x in lines if not x.startswith('#')]
              if not segs or not any(x.startswith('#EXTINF:') for x in lines): return 'HLS SEM SEGMENTOS'
              _,sample,status=get(urllib.parse.urljoin(final,segs[-1]),True)
              if not sample or sample.lstrip().lower().startswith((b'<html',b'<!doctype',b'{')): return 'SEGMENTO INVÁLIDO'
              return 'HLS ACESSÍVEL'

          def test(item):
              start=time.monotonic()
              try: result=playlist(item['url'])
              except urllib.error.HTTPError as e: result='HTTP '+str(e.code)
              except Exception as e: result='FALHA: '+type(e).__name__
              return dict(item,resultado=result,segundos=round(time.monotonic()-start,1))

          def main():
              channels=json.loads(Path('canais.json').read_text(encoding='utf-8-sig'))['channels']
              known={u for ch in channels for u in [ch['url']]+ch.get('alternatives',[])}
              history_path=Path('historico-anterior/candidatos-teste.csv')
              with history_path.open(encoding='utf-8-sig',newline='') as f:
                  history=list(csv.DictReader(f,delimiter=';'))
              tested={x['url'].strip() for x in history if x.get('url') and x.get('resultado')}
              if len(tested)!=37:
                  raise ValueError(f'Histórico inesperado: {len(tested)} URLs; esperadas 37. Teste cancelado para evitar repetição.')
              candidates={}; stats=[]
              for source,url in CATALOGS.items():
                  try:
                      _,data,_=get(url,limit=8*LIMIT)
                      if len(data)>8*LIMIT: raise ValueError('catálogo grande demais')
                      body=data.decode('utf-8-sig',errors='replace')
                      if not body.lstrip().startswith('#EXTM3U'): raise ValueError('catálogo não M3U')
                      entries=list(parse_m3u(body)); new=0
                      for name,group,stream in entries:
                          if stream in known: continue
                          if stream in candidates:
                              if source not in candidates[stream]['catalogos']: candidates[stream]['catalogos'].append(source)
                              continue
                          rank,category=classify(name,group)
                          candidates[stream]={'nome':name,'categoria':category,'url':stream,'catalogos':[source],'prioridade':rank}
                          new+=1
                      stats.append((source,len(entries),new,'OK'))
                  except Exception as e: stats.append((source,0,0,'FALHA: '+type(e).__name__))
              # All pending candidates, with a safety cap for catalog growth.
              ordered=sorted(candidates.values(),key=lambda x:(x['prioridade'],norm(x['nome']),x['url']))
              skipped=sum(x['url'] in tested for x in ordered)
              pending=[x for x in ordered if x['url'] not in tested]
              selection=pending[:220]
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool: results=list(pool.map(test,selection))
              accessible=sum(x['resultado']=='HLS ACESSÍVEL' for x in results)
              def esc(s): return str(s).replace('|','\\|').replace('\n',' ')
              lines=['# RAF TV FÁCIL — Busca de canais','',f'{len(channels)} canais atuais preservados; {len(candidates)} URLs candidatas; {len(tested)} URLs no histórico; {skipped} repetidas ignoradas; {len(pending)} pendentes encontradas; {len(results)} novas testadas; {accessible} acessíveis; {len(pending)-len(results)} ainda pendentes.','', 'Teste de acesso, sem decodificação. Origem/identidade e autorização precisam ser confirmadas antes de publicar. Não é teste no Brasil. Nenhuma alteração no canais.json.','', '## Catálogos','| Fonte | Entradas HTTPS HLS elegíveis | Novas únicas | Estado |','|---|---:|---:|---|']
              lines += ['| '+' | '.join(map(esc,s))+' |' for s in stats]
              lines += ['', '## Resultados', '| Canal | Categoria | Catálogos | Resultado | Segundos |','|---|---|---|---|---:|']
              for x in results:
                  row=[x['nome'],x['categoria'],', '.join(x['catalogos']),x['resultado'],x['segundos']]
                  lines.append('| '+' | '.join(map(esc,row))+' |'); print(*row,sep=' | ')
              report='\n'.join(lines)+'\n'; print('\n'+report)
              Path('relatorio-busca.md').write_text(report,encoding='utf-8')
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f: f.write(report)
              fields=['nome','categoria','catalogos','resultado','segundos','url']
              with open('candidatos-teste.csv','w',encoding='utf-8-sig',newline='') as f:
                  w=csv.DictWriter(f,fields,delimiter=';',extrasaction='ignore'); w.writeheader()
                  for x in results: w.writerow(dict(x,catalogos=', '.join(x['catalogos'])))
              with open('historico-completo.csv','w',encoding='utf-8-sig',newline='') as f:
                  w=csv.DictWriter(f,fields,delimiter=';',extrasaction='ignore'); w.writeheader()
                  w.writerows(history)
                  for x in results: w.writerow(dict(x,catalogos=', '.join(x['catalogos'])))
              Path('candidatos-revisao.json').write_text(json.dumps({'observacao':'Somente revisão; não é a lista do aplicativo. Verificar autorização e reprodução.','candidatos':[x for x in results if x['resultado']=='HLS ACESSÍVEL']},ensure_ascii=False,indent=2),encoding='utf-8')
          if __name__=='__main__': main()
          PYTEST
      - uses: actions/upload-artifact@v4
        with:
          name: RAF-TV-FACIL-Relatorio-Busca-Pendentes-V2
          path: |
            relatorio-busca.md
            candidatos-teste.csv
            candidatos-revisao.json
            historico-completo.csv
          if-no-files-found: error
