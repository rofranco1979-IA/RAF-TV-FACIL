            private void addButton(LinearLayout container,Button b){LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);lp.setMargins(0,dp(6),0,0);container.addView(b,lp);}
            private void scheduleRetry(){
                handler.removeCallbacks(timeout);handler.removeCallbacks(reconnect);
                if(!active || player==null)return;
                if(attempts>=2){
                    if(sourceIndex+1<sources(index).length){sourceIndex++;attempts=0;showStatus("Tentando outra fonte…");handler.postDelayed(reconnect,1500);return;}
                    showStatus("Canal indisponível.\nUse as setas para trocar ou OK para escolher.");return;
                }
                int delay=3*(++attempts);
                showStatus("Reconectando " + names[index] + "…\nAguarde ou troque de canal.");
                handler.postDelayed(reconnect,delay*1000L);
            }
            private void installer(){
                new AlertDialog.Builder(this).setTitle("Configuração do instalador")
                    .setItems(new String[]{"Abrir TV ao ligar o aparelho","Atualizar canais agora","Endereço da lista de canais"},(d,w)->{
                        if(w==0)setupHome();else if(w==1)refreshList(true);else editListUrl();
                    }).setNegativeButton("Voltar",null).show();
            }
            private void editListUrl(){
                EditText input=new EditText(this);input.setSingleLine(true);input.setInputType(InputType.TYPE_CLASS_TEXT|InputType.TYPE_TEXT_VARIATION_URI);
                input.setText(getPreferences(MODE_PRIVATE).getString("list_url",DEFAULT_LIST));
                new AlertDialog.Builder(this).setTitle("Lista HTTPS autorizada (JSON)").setView(input).setNegativeButton("Cancelar",null).setPositiveButton("Salvar",(d,w)->{
                    String value=input.getText().toString().trim();
                    if(!validHttps(value)){Toast.makeText(this,"Use um endereço HTTPS válido",Toast.LENGTH_LONG).show();return;}
                    getPreferences(MODE_PRIVATE).edit().putString("list_url",value).apply();refreshList(true);
                }).show();
            }
            private boolean validHttps(String u){try{URL parsed=new URL(u);return "https".equalsIgnoreCase(parsed.getProtocol()) && parsed.getHost()!=null&&!parsed.getHost().isEmpty()&&parsed.getUserInfo()==null;}catch(Exception e){return false;}}
            private boolean applyList(String data) throws Exception{
                JSONArray array=new JSONObject(data).getJSONArray("channels");
                if(array.length()<1||array.length()>200)return false;
                ArrayList<String> nn=new ArrayList<>(), uu=new ArrayList<>(), cc=new ArrayList<>(), ff=new ArrayList<>(), ll=new ArrayList<>();ArrayList<String[]> ss=new ArrayList<>();HashSet<String> seen=new HashSet<>();
                for(int i=0;i<array.length();i++){
                    JSONObject o=array.getJSONObject(i);String n=o.getString("name").trim(),u=o.getString("url").trim();
                    if(n.isEmpty()||n.length()>60||!validHttps(u)||!seen.add(n))return false;
                    nn.add(n);uu.add(u);String cat=validCategory(o.optString("category", ""),n);cc.add(cat);
                    String fmt=o.optString("format",cat.startsWith("Rádios")?"audio":"hls").toLowerCase(java.util.Locale.ROOT);ff.add(fmt.equals("audio")||fmt.equals("auto")?fmt:"hls");
                    String logo=o.optString("logo", "");ll.add(validHttps(logo)?logo:"");
                    LinkedHashSet<String> candidates=new LinkedHashSet<>();candidates.add(u);
                    JSONArray extra=o.optJSONArray("alternatives");
                    if(extra!=null)for(int k=0;k<extra.length()&&candidates.size()<3;k++){String alt=extra.optString(k,"").trim();if(validHttps(alt))candidates.add(alt);}
                    ss.add(candidates.toArray(new String[0]));
                }
                names=nn.toArray(new String[0]);urls=uu.toArray(new String[0]);categories=cc.toArray(new String[0]);alternatives=ss.toArray(new String[0][]);formats=ff.toArray(new String[0]);logos=ll.toArray(new String[0]);return true;
            }
            private void refreshList(boolean manual){
                final int request=++refreshGeneration;
                if(manual)Toast.makeText(this,"Atualizando lista…",Toast.LENGTH_SHORT).show();
                final String address=getPreferences(MODE_PRIVATE).getString("list_url",DEFAULT_LIST);
                new Thread(()->{
                    try{
                        if(!validHttps(address))throw new IOException();
                        HttpsURLConnection c=(HttpsURLConnection)new URL(address).openConnection();
                        c.setUseCaches(false);c.setRequestProperty("Cache-Control","no-cache");c.setConnectTimeout(7000);c.setReadTimeout(7000);c.setInstanceFollowRedirects(false);
                        String data;
                        try{
                            if(c.getResponseCode()!=200)throw new IOException();
                            try(InputStream in=c.getInputStream();ByteArrayOutputStream out=new ByteArrayOutputStream()){
                                byte[] buf=new byte[4096];int count;while((count=in.read(buf))!=-1){out.write(buf,0,count);if(out.size()>262144)throw new IOException();}
                                data=new String(out.toByteArray(),StandardCharsets.UTF_8);
                            }
                        }finally{c.disconnect();}
                        runOnUiThread(()->{
                            if(!active||request!=refreshGeneration)return;
                            String old=names[index],oldUrl=urls[index],oldFormat=formats[index],oldCat=categories[index];String[] oldSources=sources(index);int oldIndex=index;String oldMenu=menuCategory;
                            try{
                                if(!applyList(data))throw new IOException();
                                getPreferences(MODE_PRIVATE).edit().putString("cached_list",data).apply();
                                index=findChannel(old,oldUrl,oldIndex);
                                if(!oldUrl.equals(urls[index])||!oldFormat.equals(formats[index])||!oldCat.equals(categories[index])||!java.util.Arrays.equals(oldSources,sources(index)))tune(index);
                                else {saveLast();updateRadioPanel();}
                                if(panel!=null)showMenu(oldMenu);
                                if(manual)Toast.makeText(this,"Lista atualizada: "+names.length+" canais",Toast.LENGTH_LONG).show();
                            }catch(Exception e){if(manual)Toast.makeText(this,"Lista inválida. Mantivemos os canais anteriores.",Toast.LENGTH_LONG).show();}
                        });
                    }catch(Exception e){runOnUiThread(()->{if(active&&request==refreshGeneration&&manual)Toast.makeText(this,"Não foi possível atualizar. Canais anteriores mantidos.",Toast.LENGTH_LONG).show();});}
                }).start();
            }
            private void setupHome(){
                new AlertDialog.Builder(this).setTitle("Abrir a TV ao ligar")
                  .setMessage("Se o aparelho permitir, escolha RAF TV FÁCIL como app de início (Home). Assim, a TV abrirá quando o aparelho carregar sua tela inicial. Para voltar ao menu original do aparelho, altere novamente o app de início nas configurações. Alguns TV Boxes não oferecem essa opção.")
                  .setNegativeButton("Cancelar",null).setPositiveButton("Abrir configuração",(d,w)->{
                      try{ startActivity(new Intent(Settings.ACTION_HOME_SETTINGS)); }
                      catch(ActivityNotFoundException e){ try{startActivity(new Intent(Settings.ACTION_SETTINGS));}catch(Exception ignored){Toast.makeText(this,"Configuração não disponível neste aparelho",Toast.LENGTH_LONG).show();} }
                  }).show();
            }
            @Override public boolean dispatchKeyEvent(KeyEvent e){
                int k=e.getKeyCode();boolean down=e.getAction()==KeyEvent.ACTION_DOWN;
                if(k==KeyEvent.KEYCODE_CHANNEL_UP || k==KeyEvent.KEYCODE_CHANNEL_DOWN){if(down&&e.getRepeatCount()==0){closeMenu();tune(index+(k==KeyEvent.KEYCODE_CHANNEL_UP?1:-1));}return true;}
                if(k==KeyEvent.KEYCODE_MENU){if(down&&e.getRepeatCount()==0){if(panel==null)openMenu();else installer();}return true;}
                if(panel==null){
                    if(k==KeyEvent.KEYCODE_DPAD_UP||k==KeyEvent.KEYCODE_DPAD_RIGHT||k==KeyEvent.KEYCODE_DPAD_DOWN||k==KeyEvent.KEYCODE_DPAD_LEFT){if(down&&e.getRepeatCount()==0)tune(index+((k==KeyEvent.KEYCODE_DPAD_UP||k==KeyEvent.KEYCODE_DPAD_RIGHT)?1:-1));return true;}
                    if(k==KeyEvent.KEYCODE_DPAD_CENTER||k==KeyEvent.KEYCODE_ENTER||k==KeyEvent.KEYCODE_MENU){if(down&&e.getRepeatCount()==0)openMenu();return true;}
                }
                return super.dispatchKeyEvent(e);
            }
            @Override public void onBackPressed(){if(panel!=null){if(menuCategory!=null)openMenu();else closeMenu();}else openMenu();}
        }
