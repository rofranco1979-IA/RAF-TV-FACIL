        public class MainActivity extends Activity {
            // Grade experimental, sem retransmissão própria.
            private String[] names = {"TV Câmara", "TV Brasil", "Canal Gov", "TV Cultura"};
            private String[] urls = {
                "https://stream3.camara.gov.br/tv1/manifest.m3u8",
