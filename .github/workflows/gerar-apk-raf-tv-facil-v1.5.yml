                    case "TVE RS": return "Públicos e educativos";
                    case "Globo SP": return "TV aberta";
                    case "TV TEM Sorocaba": return "TV aberta";
                    case "SBT TVS+ Sorocaba": return "TV aberta";
                    case "Record SP": return "TV aberta";
                    case "Grjngo - Faroeste (teste)": return "Filmes e faroeste";
                    case "Retro Cartoon (teste)": return "Desenhos";
                    case "Series Classic (teste)": return "Séries e comédia";
                    default: return "Outros";
                }
            }
            private String validCategory(String value,String name){
                for(String c:CATEGORY_ORDER)if(c.equals(value))return c;
                return inferCategory(name);
            }
            private int categoryColor(String c){for(int i=0;i<CATEGORY_ORDER.length;i++)if(CATEGORY_ORDER[i].equals(c))return CATEGORY_COLORS[i];return 0xFF39485A;}
            private String[] sources(int i){
                if(alternatives[i]!=null)return alternatives[i];
                return new String[]{urls[i]};
            }
            private void saveLast(){getPreferences(MODE_PRIVATE).edit().putInt("last",index).putString("last_name",names[index]).putString("last_url",urls[index]).apply();}
            private int findChannel(String name,String url,int fallback){
                for(int i=0;i<names.length;i++)if(names[i].equals(name))return i;
                for(int i=0;i<names.length;i++)if(displayName(names[i]).equals(displayName(name)))return i;
                if(!url.isEmpty())for(int i=0;i<urls.length;i++)if(urls[i].equals(url))return i;
                return Math.max(0,Math.min(names.length-1,fallback));
            }
            private boolean active = false;
            private final Runnable reconnect = () -> {
                if (active && this.player != null) startPlayback();
            };
            private FrameLayout root;
            private PlayerView video;
            private ExoPlayer player;
            private TextView status, banner;
            private LinearLayout panel;
            private final Handler handler = new Handler(Looper.getMainLooper());
            private final Runnable hideBanner = () -> { if (banner != null) banner.setVisibility(View.GONE); };
            private final Runnable timeout = () -> { if (player != null && player.getPlaybackState() != Player.STATE_READY) scheduleRetry(); };
            private int dp(float n) { return (int)(n * getResources().getDisplayMetrics().density + .5f); }
            @Override public void onCreate(Bundle b) {
                super.onCreate(b);
                getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                try { applyList(getPreferences(MODE_PRIVATE).getString("cached_list", "")); } catch(Exception ignored) {}
                String lastName = getPreferences(MODE_PRIVATE).getString("last_name", "");
                index = Math.max(0, Math.min(names.length-1, getPreferences(MODE_PRIVATE).getInt("last", 0)));
                index=findChannel(lastName,getPreferences(MODE_PRIVATE).getString("last_url", ""),index);
                root = new FrameLayout(this); root.setBackgroundColor(Color.BLACK);
                video = new PlayerView(this); video.setUseController(false); video.setFocusable(false);
                video.setOnClickListener(v -> toggleMenu());
                root.addView(video, new FrameLayout.LayoutParams(-1,-1));
                radioPanel=new LinearLayout(this);radioPanel.setOrientation(LinearLayout.VERTICAL);radioPanel.setGravity(Gravity.CENTER);radioPanel.setBackgroundColor(0xFF101C2E);radioPanel.setPadding(dp(20),dp(12),dp(20),dp(12));
                radioLogo=new ImageView(this);radioLogo.setScaleType(ImageView.ScaleType.FIT_CENTER);radioPanel.addView(radioLogo,new LinearLayout.LayoutParams(dp(112),dp(112)));
                radioName=label("",32);radioName.setGravity(Gravity.CENTER);radioPanel.addView(radioName);
                radioTrack=label("Rádio ao vivo",22);radioTrack.setGravity(Gravity.CENTER);radioPanel.addView(radioTrack);
                TextView radioHelp=label("↑ ↓ Trocar estação   •   OK Canais",18);radioHelp.setGravity(Gravity.CENTER);radioPanel.addView(radioHelp);
                root.addView(radioPanel,new FrameLayout.LayoutParams(-1,-1));radioPanel.setVisibility(View.GONE);radioPanel.setOnClickListener(v->toggleMenu());
                status = label("", 26); status.setGravity(Gravity.CENTER); status.setBackgroundColor(0xDC101C2E); status.setPadding(dp(18),dp(16),dp(18),dp(16));
                FrameLayout.LayoutParams st = new FrameLayout.LayoutParams(-1,-2,Gravity.CENTER); st.setMargins(dp(24),0,dp(24),0);
                root.addView(status,st); status.setVisibility(View.GONE);
                banner = label("", 25); banner.setBackgroundColor(0xE0101C2E); banner.setPadding(dp(20),dp(16),dp(20),dp(16));
                FrameLayout.LayoutParams bp = new FrameLayout.LayoutParams(-1,-2,Gravity.BOTTOM); root.addView(banner,bp); banner.setVisibility(View.GONE);
                setContentView(root); immersive();
            }
            private TextView label(String text, int size) { TextView t = new TextView(this); t.setText(text); t.setTextSize(size); t.setTextColor(Color.WHITE); return t; }
            private void immersive() { getWindow().getDecorView().setSystemUiVisibility(5894 | View.SYSTEM_UI_FLAG_LAYOUT_STABLE); }
            @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if(f) immersive(); }
            @Override protected void onStart() { super.onStart(); active=true; if(player==null) {
                player=new ExoPlayer.Builder(this).build(); video.setPlayer(player);
                player.addListener(new Player.Listener(){
                    @Override public void onPlaybackStateChanged(int s) {
                        if(s==Player.STATE_READY) { handler.removeCallbacks(timeout); handler.removeCallbacks(reconnect); attempts=0; status.setVisibility(View.GONE); }
                        else if(s==Player.STATE_BUFFERING) { showStatus("Carregando " + names[index] + "…"); handler.removeCallbacks(timeout); handler.postDelayed(timeout,20000); }
                        else if(s==Player.STATE_ENDED) scheduleRetry();
                    }
                    @Override public void onPlayerError(PlaybackException e) { scheduleRetry(); }
                    @Override public void onMediaMetadataChanged(MediaMetadata metadata){
                        if(!isRadio()||radioTrack==null)return;
                        String title=metadata.title==null?"":metadata.title.toString();String artist=metadata.artist==null?"":metadata.artist.toString();
                        radioTrack.setText(title.isEmpty()?"Rádio ao vivo":artist.isEmpty()?title:artist+" — "+title);
                    }
                });
                tune(index);
                refreshList(false);
            }}
            @Override protected void onStop() { active=false; handler.removeCallbacksAndMessages(null); if(player!=null){video.setPlayer(null);player.release();player=null;} refreshGeneration++; super.onStop(); }
            private void showStatus(String text){ status.setText(text);status.setVisibility(View.VISIBLE); }
            private void tune(int n){
                attempts=0; sourceIndex=0; handler.removeCallbacks(reconnect); handler.removeCallbacks(timeout);
                index=(n+names.length)%names.length; saveLast();updateRadioPanel();
                banner.setText(String.format(java.util.Locale.ROOT,"%02d   %s     •     ↑ ↓ Trocar     •     OK Canais",index+1,displayName(names[index]))); banner.setVisibility(View.VISIBLE);
                handler.removeCallbacks(hideBanner);handler.postDelayed(hideBanner,4500);
                startPlayback();
            }
            private void startPlayback(){
                if(player==null || !active)return;
                handler.removeCallbacks(timeout); handler.removeCallbacks(reconnect);
                showStatus("Carregando " + names[index] + "…");
                String url=sources(index)[sourceIndex];
                MediaItem.Builder item=new MediaItem.Builder().setUri(url);
                if(formats[index].equals("hls")||url.toLowerCase(java.util.Locale.ROOT).contains(".m3u8"))item.setMimeType(MimeTypes.APPLICATION_M3U8);
                player.setMediaItem(item.build());
                player.prepare();player.play();handler.removeCallbacks(timeout);handler.postDelayed(timeout,20000);
            }
            private GradientDrawable bg(int color){GradientDrawable g=new GradientDrawable();g.setColor(color);g.setCornerRadius(dp(10));return g;}
            private Button action(String name, Runnable run){return action(name,0xFF26394F,run);}
            private Button action(String name,int color,Runnable run){
                Button b=new Button(this);b.setText(name);b.setAllCaps(false);b.setTextSize(23);b.setTextColor(Color.WHITE);b.setMinHeight(dp(52));b.setFocusable(true);b.setFocusableInTouchMode(true);b.setId(View.generateViewId());b.setBackground(bg(color));
                b.setOnFocusChangeListener((v,f)->{ b.setBackground(bg(f?0xFF245BC1:color)); if(f){GradientDrawable focused=bg(0xFF245BC1);focused.setStroke(dp(3),Color.WHITE);b.setBackground(focused);} });b.setOnClickListener(v->run.run());return b;
            }
            private void closeMenu(){if(panel!=null){root.removeView(panel);panel=null;} menuCategory=null; immersive();}
            private void toggleMenu(){if(panel!=null)closeMenu();else openMenu();}
            private void openMenu(){showMenu(null);}
            private void openPluto(){
                final String pkg="tv.pluto.android";
                try {
                    Intent app=getPackageManager().getLeanbackLaunchIntentForPackage(pkg);
                    if(app==null)app=getPackageManager().getLaunchIntentForPackage(pkg);
                    if(app!=null){closeMenu();startActivity(app);return;}
                }catch(Exception ignored){}
                new AlertDialog.Builder(this).setTitle("Pluto TV oficial")
                  .setMessage("Instale o aplicativo gratuito Pluto TV pela loja oficial ou acesse o site. Para voltar, use o botão Voltar do controle remoto.")
                  .setNegativeButton("Voltar",null)
