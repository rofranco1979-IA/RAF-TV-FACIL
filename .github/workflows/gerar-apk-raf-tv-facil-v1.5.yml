            private static final String DEFAULT_LIST = "https://raw.githubusercontent.com/rofranco1979-IA/RAF-TV-FACIL/main/canais.json";
            private static final int[] TILE_COLORS={0xFF294F78,0xFF276047,0xFF46517B,0xFF63512E,0xFF385D68,0xFF51446E};
            private int index = 0, attempts = 0, refreshGeneration = 0;
            private String[] categories = {"Públicos e educativos", "Públicos e educativos", "Públicos e educativos", "TV aberta"};
            private String[][] alternatives = new String[4][];
            private String[] formats = {"hls","hls","hls","hls"};
