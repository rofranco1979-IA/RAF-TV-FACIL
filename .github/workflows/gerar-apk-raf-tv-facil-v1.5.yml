        cat > 'README.md' <<'RAF_FILE_8'
        # RAF TV FÁCIL 1.5 — protótipo Android TV / TV Box
        Aplicativo separado, sem cadastro, sem alteração do RAF STREAMING. Android 6+ (API 23), player HLS e áudio direto Media3.

        ## Instalação de teste
        1. Gere o APK pelo workflow manual do GitHub Actions. Baixe o artefato ZIP, extraia e instale o APK no aparelho.
        2. Abra o aplicativo. Setas trocam canal; OK abre a lista; Voltar alterna lista e TV. Volume usa o controle do aparelho.
        3. Para abrir automaticamente, na lista mantenha OK pressionado sobre um canal (ou MENU duas vezes, ou toque longo no título). Selecione Abrir TV ao ligar o aparelho. Selecione RAF TV FÁCIL como aplicativo de início (Home), **somente se o aparelho disponibilizar essa escolha**. Para desfazer, retorne às configurações de Home e escolha o launcher anterior. Não há bloqueio de sistema nem garantia de abertura automática em qualquer aparelho.

        ## Categorias e atualização
        OK abre categorias; escolha uma ou Todos os canais. Voltar retorna às categorias e à TV. Atualizar lista fica no rodapé; mantenha OK pressionado nesse botão para acessar o instalador. O JSON aceita category e alternatives (até dois HTTPS adicionais por canal), sem alterar o formato antigo. A troca de fonte é automática após falhas; não foram adicionados novos sinais nesta versão.

        ## V1.5
        Barra de rolagem vertical visível na grade de canais e categorias, preservando o foco e os controles. Ícones com iniciais são usados como alternativa quando não há imagem válida. Logotipos HTTPS aceitam redirecionamentos HTTPS limitados.

        ## Limitações
        Quatro entradas iniciais de contingência; a grade remota continua inalterada. Verifique a autorização individual antes de distribuir. O botão Pluto TV abre o aplicativo oficial ou a loja/site, sem incorporar o sinal ao player RAF. Não incluir espelhos desconhecidos. TV Aparecida requer autorização expressa. O campo opcional logo aceita URL HTTPS de imagem autorizada; sem logo, mantém nome e cor. Rádios usam format audio; metadata de título/artista depende da fonte. A lista remota opcional lê canais.json na raiz do repositório ao abrir; mantém cache ou lista inicial se falhar. Formato: objeto JSON com array channels contendo name e url HTTPS HLS. Até 200 entradas. Não use listas sem autorização. A TV Câmara fornece oficialmente player incorporável em https://www.camara.leg.br/tv/como-sintonizar. Verifique autorização/condições de uso de cada emissora antes de distribuir; substitua/remova fontes não aprovadas. Não há retransmissão por servidor próprio. O APK é assinado com chave persistente fornecida no segredo RAF_TV_SIGNING. Guarde uma cópia privada do segredo; nunca faça commit dele. A atualização da V1.3 usa o mesmo applicationId e a mesma chave. Não desinstale para preservar a configuração. O build falha se o segredo estiver ausente.
        RAF_FILE_8
    - name: Instalar SDK, compilar e assinar
      shell: bash
      env:
        RAF_SIGNING_JSON: ${{ secrets.RAF_TV_SIGNING }}
      run: |
        set -eu
        SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
        fi
        test -x "$SDKMANAGER"
        export ANDROID_HOME="$SDK_ROOT" ANDROID_SDK_ROOT="$SDK_ROOT"
        # GitHub runner normally has accepted licenses; accept any remaining SDK licenses.
        set +o pipefail
        yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
        set -o pipefail
        "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
        cd raf-tv-facil
        if [ -z "$RAF_SIGNING_JSON" ]; then
          echo '::error::Cadastre o segredo RAF_TV_SIGNING nas configurações do repositório antes de executar.'
          exit 1
        fi
        export RAF_KEY_FILE="$(mktemp "$RUNNER_TEMP/raf-key.XXXXXX.p12")"
        chmod 600 "$RAF_KEY_FILE"
        trap 'rm -f "$RAF_KEY_FILE"' EXIT
        RAF_PASSWORD="$(python3 - <<'RAF_SIGN'
        import json, os, base64
        secret=json.loads(os.environ['RAF_SIGNING_JSON'])
        with open(os.environ['RAF_KEY_FILE'],'wb') as f:
            f.write(base64.b64decode(secret['keystore'],validate=True))
        print(secret['password'])
        RAF_SIGN
        )"
        export RAF_PASSWORD
        echo "::add-mask::$RAF_PASSWORD"
        unset RAF_SIGNING_JSON
        gradle --no-daemon :app:assembleRelease
        mkdir -p ../dist
        "$SDK_ROOT/build-tools/35.0.0/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/raf-aligned.apk"
        "$SDK_ROOT/build-tools/35.0.0/apksigner" sign --ks "$RAF_KEY_FILE" --ks-type PKCS12 --ks-key-alias raf-tv --ks-pass env:RAF_PASSWORD --key-pass env:RAF_PASSWORD --out ../dist/RAF-TV-FACIL-V1.5-Android-TV.apk "$RUNNER_TEMP/raf-aligned.apk"
        "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs ../dist/RAF-TV-FACIL-V1.5-Android-TV.apk
        rm -f ../dist/*.idsig "$RUNNER_TEMP/raf-aligned.apk"
    - uses: actions/upload-artifact@v4
      with:
        name: RAF-TV-FACIL-V1.5-Android-TV
        path: dist/RAF-TV-FACIL-V1.5-Android-TV.apk
        if-no-files-found: error
