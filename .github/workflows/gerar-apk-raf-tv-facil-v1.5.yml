                    case "Os Smurfs": return "Desenhos";
                    case "Inspetor Bugiganga": return "Desenhos";
                    case "Toon Goggles Brasil (teste)": return "Desenhos";
                    case "Pluto TV Retrô": return "Séries e comédia";
                    case "MacGyver": return "Séries e comédia";
                    case "A Feiticeira": return "Séries e comédia";
                    case "Mr. Bean": return "Séries e comédia";
                    case "Rede Gospel": return "Religiosos";
                    case "TV Evangelizar": return "Religiosos";
                    case "TV Pai Eterno": return "Religiosos";
                    case "TV Câmara": return "Públicos e educativos";
                    case "TV Brasil": return "Públicos e educativos";
                    case "TV Senado": return "Públicos e educativos";
                    case "Canal Gov": return "Públicos e educativos";
                    case "Canal Libras": return "Públicos e educativos";
                    case "TV Câmara 2": return "Públicos e educativos";
                    case "Canal Educação": return "Públicos e educativos";
