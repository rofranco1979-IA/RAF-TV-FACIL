name: RAF TV FACIL V1.5 - Gerar APK
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Criar projeto independente
      shell: bash
      run: |
        set -eu
        mkdir -p raf-tv-facil
        cd raf-tv-facil
        mkdir -p '.'
        cat > 'settings.gradle' <<'RAF_FILE_0'
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = 'RAF-TV-FACIL'
        include ':app'
        RAF_FILE_0
        mkdir -p '.'
        cat > 'build.gradle' <<'RAF_FILE_1'
        plugins { id 'com.android.application' version '8.7.3' apply false }
        RAF_FILE_1
        mkdir -p '.'
        cat > 'gradle.properties' <<'RAF_FILE_2'
        android.useAndroidX=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        RAF_FILE_2
        mkdir -p 'app'
        cat > 'app/build.gradle' <<'RAF_FILE_3'
        plugins { id 'com.android.application' }
        android {
         namespace 'br.com.raf.tvfacil'
         compileSdk 35
         defaultConfig { applicationId 'br.com.raf.tvfacil'; minSdk 23; targetSdk 34; versionCode 7; versionName '1.5' }
         compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
        }
        dependencies {
         implementation 'androidx.media3:media3-exoplayer:1.4.1'
         implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
