            private final ExecutorService logoExecutor=Executors.newFixedThreadPool(2);
            private final android.util.LruCache<String,Bitmap> logoCache=new android.util.LruCache<String,Bitmap>(32);
            private interface LogoReady { void ready(Bitmap b); }
            private boolean isRadio(){return categories[index].startsWith("Rádios") || formats[index].equals("audio");}
            private Bitmap fallbackLogo(int ch){
                Bitmap b=Bitmap.createBitmap(128,128,Bitmap.Config.ARGB_8888);
                Canvas canvas=new Canvas(b);Paint paint=new Paint(Paint.ANTI_ALIAS_FLAG);
                paint.setColor(categoryColor(categories[ch]));canvas.drawRoundRect(0,0,128,128,22,22,paint);
                String title=displayName(names[ch]).trim();StringBuilder initials=new StringBuilder();
                for(String word:title.split("[^\\p{L}\\p{N}]+")){
                    if(word.isEmpty())continue;
                    if(initials.length()==0 || !word.equalsIgnoreCase("de"))initials.append(word.substring(0,1).toUpperCase(java.util.Locale.ROOT));
                    if(initials.length()>=2)break;
                }
                if(initials.length()==0)initials.append("TV");
                paint.setColor(Color.WHITE);paint.setTypeface(Typeface.create("sans-serif",Typeface.BOLD));paint.setTextSize(52);paint.setTextAlign(Paint.Align.CENTER);
                canvas.drawText(initials.toString(),64,64-(paint.ascent()+paint.descent())/2,paint);return b;
            }
            private HttpsURLConnection openLogoConnection(String url) throws IOException{
                URL current=new URL(url);
                for(int i=0;i<4;i++){
                    if(!validHttps(current.toString()))throw new IOException("Logo HTTPS inválido");
                    HttpsURLConnection conn=(HttpsURLConnection)current.openConnection();
                    conn.setConnectTimeout(4000);conn.setReadTimeout(4000);conn.setInstanceFollowRedirects(false);
                    int code;
                    try{code=conn.getResponseCode();}catch(IOException e){conn.disconnect();throw e;}
                    if(code==200)return conn;
                    String location=conn.getHeaderField("Location");conn.disconnect();
                    if((code==301||code==302||code==303||code==307||code==308)&&location!=null){current=new URL(current,location);continue;}
                    throw new IOException("Logo indisponível");
                }
                throw new IOException("Limite de redirecionamentos");
            }
            private void loadLogo(String url, LogoReady done){
                if(!validHttps(url))return;
                Bitmap saved=logoCache.get(url);if(saved!=null){done.ready(saved);return;}
                logoExecutor.execute(()->{
                    try{
                        HttpsURLConnection conn=openLogoConnection(url);
                        byte[] bytes;
                        try{
                            if(conn.getResponseCode()!=200)return;
                            try(InputStream in=conn.getInputStream();ByteArrayOutputStream out=new ByteArrayOutputStream()){
                                byte[] buf=new byte[8192];int n;while((n=in.read(buf))!=-1){out.write(buf,0,n);if(out.size()>1048576)return;}bytes=out.toByteArray();
                            }
                        }finally{conn.disconnect();}
                        BitmapFactory.Options o=new BitmapFactory.Options();o.inJustDecodeBounds=true;BitmapFactory.decodeByteArray(bytes,0,bytes.length,o);
                        if(o.outWidth<=0||o.outHeight<=0||o.outWidth>8192||o.outHeight>8192)return;
                        o.inSampleSize=1;while(Math.max(o.outWidth,o.outHeight)/o.inSampleSize>384)o.inSampleSize*=2;
                        o.inJustDecodeBounds=false;Bitmap b=BitmapFactory.decodeByteArray(bytes,0,bytes.length,o);
                        if(b!=null){logoCache.put(url,b);runOnUiThread(()->{if(!isDestroyed())done.ready(b);});}
                    }catch(Exception ignored){}
                });
            }
            private void updateRadioPanel(){
                if(radioPanel==null)return;
                radioPanel.setVisibility(isRadio()?View.VISIBLE:View.GONE);
                radioName.setText(displayName(names[index]));radioTrack.setText("Rádio ao vivo");radioLogo.setImageBitmap(fallbackLogo(index));
                final String expected=logos[index];final String channel=urls[index];
                if(isRadio())loadLogo(expected,b->{if(urls[index].equals(channel)&&logos[index].equals(expected))radioLogo.setImageBitmap(b);});
            }
            private void applyButtonIcon(Button button,Bitmap b){
                BitmapDrawable icon=new BitmapDrawable(getResources(),b);icon.setBounds(0,0,dp(40),dp(40));button.setCompoundDrawables(icon,null,null,null);button.setCompoundDrawablePadding(dp(8));
            }
            private void setButtonLogo(Button button,int ch){
                applyButtonIcon(button,fallbackLogo(ch));
                loadLogo(logos[ch],b->{if(button.isAttachedToWindow())applyButtonIcon(button,b);});
            }
            @Override protected void onDestroy(){logoExecutor.shutdownNow();super.onDestroy();}
            private int sourceIndex = 0;
            private String menuCategory = null;
            private static final String ALL = "Todos os canais";
            private static final String[] CATEGORY_ORDER = {"TV aberta", "Notícias", "Filmes e faroeste", "Desenhos", "Séries e comédia", "Religiosos", "Públicos e educativos", "Shows e músicas", "Rádios on-line", "Rádios por ritmo", "Outros"};
            private static final int[] CATEGORY_COLORS = {0xFF164C91,0xFF455A64,0xFFA33131,0xFF875409,0xFF684098,0xFF176344,0xFF126478,0xFF8A416D,0xFF27685D,0xFF5C458B,0xFF39485A};
            private String displayName(String name){
                String[] prefixes={"TV · ","Notícias · ","Filmes · ","Desenhos · ","Séries · ","Fé · ","Públicos · "};
                for(String prefix:prefixes)if(name.startsWith(prefix))return name.substring(prefix.length());
                return name;
            }
            private String inferCategory(String raw){
                String n=displayName(raw);
                switch(n){
                    case "Globo SP (teste)": return "TV aberta";
                    case "TV TEM Sorocaba (teste)": return "TV aberta";
                    case "SBT TVS+ Sorocaba (teste)": return "TV aberta";
                    case "Record SP (teste)": return "TV aberta";
                    case "SBT Interior": return "TV aberta";
                    case "Band": return "TV aberta";
                    case "RedeTV!": return "TV aberta";
                    case "RedeTV! Mais": return "TV aberta";
                    case "RedeTV! Paraná": return "TV aberta";
                    case "TV Cultura": return "TV aberta";
                    case "TV Gazeta": return "TV aberta";
                    case "Rede Brasil": return "TV aberta";
                    case "SBT RJ": return "TV aberta";
                    case "Globo - TV Morena": return "TV aberta";
                    case "Record": return "TV aberta";
                    case "Record News": return "Notícias";
                    case "SBT News": return "Notícias";
                    case "Pluto TV Bang Bang": return "Filmes e faroeste";
                    case "Pluto TV Cine Clássicos": return "Filmes e faroeste";
                    case "Pluto TV Cine Trapalhões": return "Filmes e faroeste";
                    case "Pluto TV Filmes Nacionais": return "Filmes e faroeste";
                    case "Pluto TV Cine Família": return "Filmes e faroeste";
                    case "Runtime TV e Filmes": return "Filmes e faroeste";
                    case "Runtime Ação": return "Filmes e faroeste";
                    case "Runtime Comédia": return "Filmes e faroeste";
                    case "Runtime Família": return "Filmes e faroeste";
                    case "Runtime Romance": return "Filmes e faroeste";
